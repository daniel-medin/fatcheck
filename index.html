<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111318">
    <title>Fat Check</title>
    <link rel="icon" href="assets/logo.svg?v=scale-1" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/logo.svg?v=scale-1">
    <link rel="stylesheet" href="styles.css?v=20260507-12">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js" defer></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
    <script src="app.js?v=20260507-12" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand-lockup" aria-label="Fat Check">
          <img class="logo" src="assets/logo.svg?v=scale-1" alt="">
          <div>
            <p class="eyebrow">Fat Check</p>
            <h1>Calories</h1>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="settingsButton" type="button" aria-label="BitStore setup" title="BitStore setup">
            <i data-lucide="key-round"></i>
          </button>
          <button class="icon-button" id="goalButton" type="button" aria-label="Set daily goal" title="Set daily goal">
            <i data-lucide="target"></i>
          </button>
          <button class="icon-button" id="burnrateButton" type="button" aria-label="Set burnrate" title="Set burnrate">
            <i data-lucide="flame"></i>
          </button>
          <button class="icon-button refresh-button" id="refreshButton" type="button" aria-label="Refresh" title="Refresh">
            <i data-lucide="refresh-cw"></i>
          </button>
        </div>
      </header>

      <section class="summary-band" aria-labelledby="weekTotalLabel">
        <div>
          <p id="weekTotalLabel" class="eyebrow">This week</p>
          <p class="week-total"><span id="weekTotal">0</span><span> kcal</span></p>
          <p class="goal-delta" id="goalDelta">Set a daily goal</p>
        </div>
        <div class="today-pill">
          <span>Today</span>
          <strong id="todayTotal">0</strong>
        </div>
      </section>

      <section class="chart-panel" aria-label="Weekly calories">
        <div class="panel-title-row">
          <div class="week-title">
            <h2>Week</h2>
            <div class="week-nav" aria-label="Change week">
              <button class="mini-icon-button" id="previousWeekButton" type="button" aria-label="Previous week" title="Previous week">
                <i data-lucide="chevron-left"></i>
              </button>
              <button class="mini-icon-button" id="nextWeekButton" type="button" aria-label="Next week" title="Next week">
                <i data-lucide="chevron-right"></i>
              </button>
            </div>
          </div>
          <span id="weekRange">-</span>
        </div>
        <div class="chart-wrap">
          <canvas id="weekChart" aria-label="Calories by day" role="img"></canvas>
        </div>
      </section>

      <section class="entry-panel" aria-labelledby="addCaloriesTitle">
        <div class="panel-title-row">
          <h2 id="addCaloriesTitle">Add calories</h2>
        </div>

        <form id="calorieForm" class="calorie-form" autocomplete="off">
          <label class="calorie-input">
            <span>kcal</span>
            <input id="calorieInput" name="calories" type="number" inputmode="numeric" min="1" max="99999999" required>
          </label>
          <button class="primary-button" type="submit">
            <i data-lucide="plus"></i>
            <span>Add</span>
          </button>
        </form>

        <div class="quick-row" aria-label="Quick add">
          <button type="button" data-quick="100">+100</button>
          <button type="button" data-quick="250">+250</button>
          <button type="button" data-quick="500">+500</button>
          <button type="button" data-quick="750">+750</button>
        </div>
      </section>

      <section class="history-panel" aria-labelledby="recentTitle">
        <div class="panel-title-row">
          <h2 id="recentTitle">Recent</h2>
          <div class="history-actions">
            <span id="recordCount">0 records</span>
            <button class="danger-icon-button" id="resetButton" type="button" aria-label="Reset all" title="Reset all">
              <i data-lucide="rotate-ccw"></i>
            </button>
          </div>
        </div>
        <ol id="recentList" class="recent-list"></ol>
      </section>

      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
    </main>

    <div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
      <div class="modal-backdrop" id="settingsBackdrop"></div>
      <section class="modal-panel">
        <div class="panel-title-row">
          <h2 id="settingsTitle">Settings</h2>
          <button class="icon-button ghost" id="closeSettingsButton" type="button" aria-label="Close settings" title="Close settings">
            <i data-lucide="x"></i>
          </button>
        </div>
        <form id="keyForm" class="key-form" autocomplete="off">
          <label>
            <span>Bucket slug</span>
            <input id="bucketSlugInput" name="bucketSlug" type="text" placeholder="fat-check" autocapitalize="none" spellcheck="false">
          </label>
          <label>
            <span>Write key</span>
            <input id="writeKeyInput" name="writeKey" type="password" placeholder="X-BitStore-Key">
          </label>
          <a class="setup-link" href="https://bitstorehome.azurewebsites.net/HowTo" target="_blank" rel="noopener noreferrer">BitStore setup guide</a>
          <div class="key-actions">
            <button class="secondary-button" type="submit">Save</button>
            <button class="text-button" id="clearKeyButton" type="button">Forget</button>
          </div>
        </form>
      </section>
    </div>
  </body>
</html>
